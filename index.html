<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Productos - CRUD Git Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Gestor de Productos</h1>

    <form id="product-form" class="card">
      <input type="hidden" id="product-id">

      <div class="form-group">
        <label for="name">Nombre del producto</label>
        <input type="text" id="name" placeholder="Ej. Teclado mecánico" required>
      </div>

      <div class="form-group">
        <label for="category">Categoría</label>
        <input type="text" id="category" placeholder="Ej. Periféricos" required>
      </div>

      <div class="form-group">
        <label for="price">Precio (RD$)</label>
        <input type="number" id="price" step="0.01" placeholder="Ej. 2500.00" required>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn">Guardar producto</button>
        <button type="button" id="cancel-btn" class="secondary hidden">Cancelar</button>
      </div>
      <p id="error-msg" class="error-msg"></p>
    </form>

    <section class="card">
      <h2>Listado de Productos</h2>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio (RD$)</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="product-list">
          <tr>
            <td colspan="4" class="empty">No hay productos registrados.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
